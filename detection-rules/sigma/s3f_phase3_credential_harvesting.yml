title: S3F Phase 3 - Credential Harvesting Page Click
id: s3f-phase3-credential-harvest-001
status: experimental
description: |
  Detects when users click on links to potential credential harvesting/phishing pages.
  Correlates email clicks with web proxy logs showing access to suspicious login pages.
  Maps to S3F Phase 3 (Initial Contact & Engagement).
references:
  - https://github.com/curlycris13bits/s3f
  - https://attack.mitre.org/techniques/T1566/002/
author: S3F Detection Team
date: 2026/07/03
modified: 2026/07/03
tags:
  - attack.initial_access
  - attack.t1566.002
  - s3f.phase3
  - credential_harvesting
  - phishing
logsource:
  category: proxy
  product: web_proxy
detection:
  selection_url_keywords:
    url|contains:
      - 'login'
      - 'signin'
      - 'verify'
      - 'account'
      - 'update'
      - 'confirm'
      - 'authenticate'
      - 'credential'
  selection_suspicious_indicators:
    - url|contains:
        - '.tk/'      # Free TLD often used in phishing
        - '.ml/'      # Free TLD often used in phishing
        - '.ga/'      # Free TLD often used in phishing
        - '.cf/'      # Free TLD often used in phishing
        - '.gq/'      # Free TLD often used in phishing
    - url|re: '.*-login.*'
    - url|re: '.*account-.*'
    - url|re: '.*verify-.*'
  selection_category:
    category:
      - 'Phishing'
      - 'Suspicious'
      - 'Newly Registered Domain'
      - 'Uncategorized'
  filter_legitimate:
    url|contains:
      - 'microsoft.com/login'
      - 'google.com/accounts'
      - 'okta.com'
      - 'login.salesforce.com'
      # Add your organization's legitimate login pages here
  condition: (selection_url_keywords and selection_suspicious_indicators) or selection_category and not filter_legitimate
fields:
  - timestamp
  - user
  - src_ip
  - url
  - category
  - user_agent
falsepositives:
  - Legitimate new SaaS applications
  - Password reset pages from trusted vendors
  - Internal login portals with suspicious naming
level: high
s3f:
  phase: '3'
  technique: '3.1'
  technique_name: 'Spear Phishing'
mitre_attack:
  tactic: 'Initial Access'
  technique: 'T1566.002'
  technique_name: 'Phishing: Spearphishing Link'
response_actions:
  - Immediately disable user account
  - Force password reset
  - Alert SOC for investigation
  - Quarantine related emails
  - Block URL at web gateway
  - Check authentication logs for suspicious logins
investigation_steps:
  - Check email gateway logs for source email
  - Verify if user entered credentials
  - Review user's recent authentication activity
  - Search for other users who clicked same URL
  - Analyze the phishing page (sandbox)
  - Report to abuse contacts / registrar
tuning_notes: |
  1. Maintain whitelist of legitimate login pages
  2. Adjust URL pattern matching for your environment
  3. Consider adding IP reputation scoring
  4. Implement time-based analysis (clicks within X minutes of email)
  5. Correlate with email events for full attack chain
example_query:
  splunk: |
    index=proxy category IN ("Phishing", "Suspicious")
    | search url="*login*" OR url="*signin*" OR url="*verify*"
    | search NOT [| inputlookup legitimate_login_urls.csv]
    | table _time, user, src_ip, url, category
  elastic: |
    event.category: web AND
    (url.full: (*login* OR *signin* OR *verify*)) AND
    (network.category: (Phishing OR Suspicious) OR url.domain: (*.tk OR *.ml OR *.ga))
  sentinel: |
    CommonSecurityLog
    | where DeviceVendor == "Proxy"
    | where RequestURL has_any ("login", "signin", "verify")
    | where not(RequestURL has_any ("microsoft.com", "google.com", "okta.com"))
